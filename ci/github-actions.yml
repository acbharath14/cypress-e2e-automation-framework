name: Cypress

# TEMPLATE ONLY — paste this file's contents into
# .github/workflows/cypress.yml via the GitHub web UI.
# Keep "on" quoted: a bare on: parses as boolean true in some YAML
# validators and GitHub then registers zero triggers.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - run: npm ci --prefix stub-api
      # npm test starts the stub and passes its URL to Cypress itself
      # via --expose, so no extra environment is needed here.
      - run: npm test
      # Static Allure report. continue-on-error: report generation must
      # never flip a green test run red.
      - run: npm run allure:generate
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
            mochawesome-report
            allure-results
            allure-report
